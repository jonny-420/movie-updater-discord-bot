version: "3"
services:
  db:
    image: postgres:15
    container_name: bot_db
    ports:
      - "127.0.0.1:5432:5432"
    command: postgres
    volumes:
      - ./Bot/db/data:/var/lib/postgresql/data
      - ./Bot/db/setup:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck: #checks if db is operating normally, i.e. accepting connections. It is a readiness probe
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 20
  bot:
    image: movie-bot
    container_name: bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
  etl:
    image: bot-etl
    container_name: bot_etl
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
  broker:
    image: rabbitmq:3-management
    container_name: bot_broker
    ports:
      - "127.0.0.1:8080:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
